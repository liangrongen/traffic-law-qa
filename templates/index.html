<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交通法知识问答</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6f8;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #1f2937;
    color: #fff;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header button {
    background: #374151;
    color: #fff;
    border: none;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  header button:hover { background: #4b5563; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.6;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #2563eb;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: #fff;
    color: #111;
    border: 1px solid #e5e7eb;
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    align-self: flex-start;
    background: #fef2f2;
    color: #991b1b;
    border: 1px solid #fecaca;
  }

  details {
    margin: 8px 0;
    font-size: 12px;
    color: #666;
  }
  details summary {
    cursor: pointer;
    user-select: none;
    padding: 4px 0;
    color: #6b7280;
  }
  details summary:hover { color: #374151; }
  .thinking-body {
    background: #f3f4f6;
    padding: 8px 12px;
    border-radius: 6px;
    margin-top: 6px;
    font-style: italic;
    color: #4b5563;
    white-space: pre-wrap;
    line-height: 1.5;
  }
  .sources-body {
    margin-top: 6px;
  }
  .source-item {
    background: #f9fafb;
    border-left: 3px solid #93c5fd;
    padding: 6px 10px;
    margin-bottom: 6px;
    border-radius: 4px;
  }
  .source-item .src-name {
    font-weight: 600;
    color: #1e40af;
    font-size: 12px;
    margin-bottom: 2px;
  }
  .source-item .src-text {
    color: #374151;
    font-size: 12px;
    line-height: 1.4;
  }

  #input-bar {
    background: #fff;
    border-top: 1px solid #e5e7eb;
    padding: 14px 20px;
    display: flex;
    gap: 10px;
  }
  #input {
    flex: 1;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    resize: none;
    max-height: 120px;
    font-family: inherit;
    outline: none;
  }
  #input:focus { border-color: #2563eb; }
  #send {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 0 22px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
  }
  #send:hover:not(:disabled) { background: #1d4ed8; }
  #send:disabled { background: #9ca3af; cursor: not-allowed; }

  .blink { animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.4; } }
</style>
</head>
<body>
<header>
  <h1>⚖️ 交通法知识问答</h1>
  <button id="reset">新对话</button>
</header>

<div id="chat"></div>

<div id="input-bar">
  <textarea id="input" rows="1" placeholder="输入你的交通法问题，Enter 发送，Shift+Enter 换行"></textarea>
  <button id="send">发送</button>
</div>

<script>
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const resetBtn = document.getElementById("reset");

let history = [];      // [{role, content}]
let sending = false;

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text || "";
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function autoResize() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
}
inputEl.addEventListener("input", autoResize);

async function send() {
  if (sending) return;
  const question = inputEl.value.trim();
  if (!question) return;

  sending = true;
  sendBtn.disabled = true;
  inputEl.value = "";
  autoResize();

  addMessage("user", question);

  const aiDiv = document.createElement("div");
  aiDiv.className = "msg assistant";
  const contentDiv = document.createElement("div");
  aiDiv.appendChild(contentDiv);
  chatEl.appendChild(aiDiv);
  chatEl.scrollTop = chatEl.scrollHeight;

  let fullContent = "";
  let thinkingText = "";
  let thinkingDetails = null;
  let thinkingBody = null;
  let sourcesDetails = null;

  try {
    const resp = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, history }),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ error: resp.statusText }));
      throw new Error(err.error || "请求失败");
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let idx;
      while ((idx = buffer.indexOf("\n\n")) !== -1) {
        const raw = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        for (const line of raw.split("\n")) {
          if (!line.startsWith("data: ")) continue;
          let payload;
          try { payload = JSON.parse(line.slice(6)); } catch { continue; }

          if (payload.type === "sources") {
            sourcesDetails = document.createElement("details");
            sourcesDetails.innerHTML = "<summary>📚 检索到的法条（点击展开）</summary>";
            const body = document.createElement("div");
            body.className = "sources-body";
            payload.sources.forEach(s => {
              const item = document.createElement("div");
              item.className = "source-item";
              const name = document.createElement("div");
              name.className = "src-name";
              name.textContent = s.source;
              const text = document.createElement("div");
              text.className = "src-text";
              text.textContent = s.raw_text.slice(0, 240) + (s.raw_text.length > 240 ? "…" : "");
              item.appendChild(name);
              item.appendChild(text);
              body.appendChild(item);
            });
            sourcesDetails.appendChild(body);
            aiDiv.insertBefore(sourcesDetails, contentDiv);

          } else if (payload.type === "thinking") {
            thinkingText += payload.text;
            if (!thinkingDetails) {
              thinkingDetails = document.createElement("details");
              thinkingDetails.innerHTML = "<summary>💭 思考过程（点击展开）</summary>";
              thinkingBody = document.createElement("div");
              thinkingBody.className = "thinking-body";
              thinkingDetails.appendChild(thinkingBody);
              aiDiv.insertBefore(thinkingDetails, contentDiv);
            }
            thinkingBody.textContent = thinkingText;

          } else if (payload.type === "content") {
            fullContent += payload.text;
            contentDiv.textContent = fullContent;
            chatEl.scrollTop = chatEl.scrollHeight;

          } else if (payload.type === "error") {
            throw new Error(payload.message);

          } else if (payload.type === "done") {
            // 结束
          }
        }
      }
    }

    if (!fullContent.trim()) {
      contentDiv.textContent = "（无回答内容）";
    }
    history.push({ role: "user", content: question });
    history.push({ role: "assistant", content: fullContent });
    if (history.length > 6) history = history.slice(-6);

  } catch (e) {
    const errDiv = document.createElement("div");
    errDiv.className = "msg error";
    errDiv.textContent = "出错了：" + e.message;
    aiDiv.appendChild(errDiv);
  } finally {
    sending = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener("click", send);
inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

resetBtn.addEventListener("click", () => {
  history = [];
  chatEl.innerHTML = "";
  inputEl.value = "";
  autoResize();
  inputEl.focus();
});

inputEl.focus();
</script>
</body>
</html>
